###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,


# I sometimes do this key combination without thinking. Why? I don't know! But I have done it a couple times too often.
# bind = $mainMod, M, exec, pidof hyprshutdown || hyprshutdown --post-cmd 'loginctl kill-session $XDG_SESSION_ID' || hyprctl dispatch exit
bind = $mainMod, M, exec, pidof rofi || $HOME/.config/rofi/menus/power.sh

bind = $mainMod, E, exec, $fileManager
# bind = $mainMod, E, exec, QT_AUTO_SCREEN_SCALE_FACTOR=0 QT_SCALE_FACTOR=1.5 $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Fullscreen binds
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, F11, fullscreen

# Lock
bind = $mainMod, L, exec, hyprlock

# TODO: Remove this and let logind handle lid switch events automatically.
# The computer does not sleep with thelid closed anyways 
# bindl = , switch:on:Lid Switch, exec, pidof hyprlock || hyprlock

# Notifs
# Use $mainMod SHIFT to avoid exiting Hyprland
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw

# Clipboard
# bind = $mainMod, Space, exec, cliphist -config-path ~/.config/cliphist/config list | $menu -dmenu -P Clipboard -display-columns 2 | cliphist decode | wl-copy
bind = $mainMod, Space, exec, pidof nwg-clipman || nwg-clipman

# bind = $mainMod SHIFT, Space, exec, cliphist wipe && notify-send "Clipboard cleared"

################################
# Hyprscrolling

# Scroll
bind = $mainMod, comma, layoutmsg, move -col
bind = $mainMod, period, layoutmsg, move +col
bind = $mainMod, a, layoutmsg, move -col
bind = $mainMod, d, layoutmsg, move +col

# Move left/right
# bind = $mainMod SHIFT, comma, layoutmsg, swapcol l
# bind = $mainMod SHIFT, period, layoutmsg, swapcol r
bind = $mainMod SHIFT, a, layoutmsg, swapcol l
bind = $mainMod SHIFT, d, layoutmsg, swapcol r

# Swap left/right. This can be thought of as scrolling with a column
bind = $mainMod SHIFT, left, layoutmsg, movewindowto l
bind = $mainMod SHIFT, right, layoutmsg, movewindowto r

# Raise and lower column size
# Unfortunately no way to make it not cycle
bind = $mainMod, minus, layoutmsg, colresize -conf
bind = $mainMod, equal, layoutmsg, colresize +conf
#   mouse5 to grow, mouse4 to shrink
bind = $mainMod, mouse:275, layoutmsg, colresize -conf
bind = $mainMod, mouse:276, layoutmsg, colresize +conf

# Move up/down
bind = $mainMod SHIFT, up, layoutmsg, movewindowto u
bind = $mainMod SHIFT, down, layoutmsg, movewindowto d

################################

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# # Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness

# --- SwayOSD volume ---
# Some of these don't sync with waybar
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle


# --- SwayOSD brightness ---
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous